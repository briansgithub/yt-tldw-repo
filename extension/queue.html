<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT-TLDW Queue</title>
  <link rel="stylesheet" href="queue.css">
</head>
<body class="yt-tldw-queue-page">
  <main>
    <h1>YouTube queue</h1>
    <div id="queue"></div>
    <details id="settings">
      <summary>Private sync settings</summary>
      <p>Sync video IDs, titles, and order to your own Windows PC. Playback preferences and highlights stay on this device.</p>
      <button type="button" id="allow-sync" hidden>Allow queue sync data</button>
      <form id="pair">
        <label>Server address <input id="origin" type="url" placeholder="https://host.example.ts.net" required></label>
        <label>Access key <input id="key" type="password" autocomplete="off" required></label>
        <button type="submit">Connect</button>
      </form>
      <button type="button" id="sync-now">Sync now</button>
      <p id="pair-status" role="status"></p>
    </details>
  </main>
  <script src="lib/queue-sync.js"></script>
  <script src="lib/queue-view.js"></script>
  <script src="queue-page.js"></script>
</body>
</html>
